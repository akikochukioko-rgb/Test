name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pin Ubuntu 24.04 until the ubuntu-latest → 26 migration (Oct 19, 2026) is settled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # v4: Node 24 runtime; does not request the removed "tools" package by default
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"

      # Always use the committed test keystore (app/rplayer-test.keystore.b64).
      # Password: rplayer-test, alias: rplayer
      - name: Decode test keystore
        run: |
          KS="$GITHUB_WORKSPACE/app/rplayer-test.keystore"
          base64 -d "$GITHUB_WORKSPACE/app/rplayer-test.keystore.b64" > "$KS"
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=rplayer-test" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=rplayer" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=rplayer-test" >> "$GITHUB_ENV"
          echo "Using committed test keystore: $KS"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: RadioPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: RadioPlayer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
