name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pin Ubuntu 24.04 until the ubuntu-latest → 26 migration (Oct 19, 2026) is settled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # v4: Node 24 runtime; does not request the removed "tools" package by default
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"

      # Signing: if KEYSTORE_BASE64 is set, use it + KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
      # Otherwise fall back to committed test keystore (passwords rplayer-test / alias rplayer).
      # Do NOT mix secrets passwords with the test keystore — that causes "password was incorrect".
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "KEYSTORE_FILE=app/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS:-rplayer}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "Using GitHub Secrets keystore"
          else
            echo "KEYSTORE_BASE64 secret not set — falling back to test keystore (rplayer-test)"
            # Leave KEYSTORE_* unset so build.gradle.kts uses defaults
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: RadioPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: RadioPlayer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
